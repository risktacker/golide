name: Build GOLIDE Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: chmod +x scripts/*.sh
      - run: npm run install:ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: golide-hub-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
